plugins {
    id 'base'
}

def releaseGroup = providers.gradleProperty('mod_group').get()
def releaseVersion = providers.gradleProperty('mod_version').get()
def configuredRepositoryPath = providers.gradleProperty('worldfinder_maven_repository').orNull
def releaseRepositoryDirectory = configuredRepositoryPath
        ? file(configuredRepositoryPath)
        : layout.buildDirectory.dir('repository').get().asFile

allprojects {
    group = releaseGroup
    version = releaseVersion

    repositories {
        mavenCentral()
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        tasks.withType(Javadoc).configureEach {
            failOnError = true
            options.encoding = 'UTF-8'
            options.charSet = 'UTF-8'
            options.docEncoding = 'UTF-8'
            options.locale = 'en'
            options.addBooleanOption('notimestamp', true)
            options.addBooleanOption('Xdoclint:all', true)
        }

        tasks.withType(Jar).configureEach {
            from(rootProject.file('LICENSE')) {
                into 'META-INF'
                rename { 'LICENSE_worldfinder' }
            }
        }
    }
}

def publishLibraries = tasks.register('publishLibraries') {
    group = 'publishing'
    description = 'Publishes WorldFinder API and Core to the prepared local Maven repository.'
    dependsOn ':api:publishMavenJavaPublicationToWorldFinderLocalRepository'
    dependsOn ':common:publishMavenJavaPublicationToWorldFinderLocalRepository'
}

def wrapperCommand = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? rootProject.file('gradlew.bat').absolutePath
        : rootProject.file('gradlew').absolutePath

def verifyPublishedLibraries = tasks.register('verifyPublishedLibraries', Exec) {
    group = 'verification'
    description = 'Resolves API and Core as an external Maven consumer, including Core transitivity.'
    dependsOn publishLibraries
    workingDir rootProject.projectDir
    commandLine wrapperCommand,
            '--no-daemon',
            '-p', rootProject.file('verification/consumer').absolutePath,
            'verifyResolvedDependencies',
            "-PworldfinderRepository=${releaseRepositoryDirectory.absolutePath}",
            "-PworldfinderGroup=${releaseGroup}",
            "-PworldfinderVersion=${releaseVersion}",
            '--console=plain'
}

def libraryBundleDirectory = layout.buildDirectory.dir('release/libraries')

def assembleLibraryBundle = tasks.register('assembleLibraryBundle', Sync) {
    group = 'distribution'
    description = 'Collects binary, source, and Javadoc JARs for WorldFinder API and Core.'
    dependsOn ':api:assemble', ':common:assemble'
    into libraryBundleDirectory
    from project(':api').layout.buildDirectory.dir('libs')
    from project(':common').layout.buildDirectory.dir('libs')
}

tasks.register('verifyLibraries') {
    group = 'verification'
    description = 'Runs the complete standalone API/Core source, binary, documentation, and Maven contract.'
    dependsOn ':api:check', ':common:check', ':api:javadoc', ':common:javadoc'
    dependsOn verifyPublishedLibraries, assembleLibraryBundle
}

tasks.register('assembleDeveloperPortal', Sync) {
    group = 'distribution'
    description = 'Assembles the public API/Core landing page and versioned Javadocs.'
    dependsOn tasks.named('verifyLibraries')
    into layout.buildDirectory.dir('developer-portal')
    from 'docs/site'
    into("javadoc/${releaseVersion}/api") {
        from project(':api').layout.buildDirectory.dir('docs/javadoc')
    }
    into("javadoc/${releaseVersion}/core") {
        from project(':common').layout.buildDirectory.dir('docs/javadoc')
    }
}
