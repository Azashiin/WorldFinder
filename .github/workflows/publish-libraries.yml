name: Publish API and Core

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: worldfinder-developer-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build developer repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source

      - name: Prepare persistent developer repository
        shell: bash
        run: |
          set -euo pipefail
          if git -C source ls-remote --exit-code --heads origin developer-pages >/dev/null; then
            git -C source fetch --depth=1 origin developer-pages
            git -C source worktree add -B developer-pages ../developer-repository FETCH_HEAD
          else
            git -C source worktree add --detach ../developer-repository HEAD
            git -C developer-repository switch --orphan developer-pages
          fi

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3

      - name: Build and verify API, Core, Maven metadata, and documentation
        working-directory: source
        run: >-
          ./gradlew clean assembleDeveloperPortal
          -Pworldfinder_maven_repository=${{ github.workspace }}/developer-repository
          --max-workers=2 --stacktrace

      - name: Preserve and publish every API/Core version
        shell: bash
        run: |
          set -euo pipefail
          rsync -a source/build/developer-portal/ developer-repository/
          git -C developer-repository config user.name "github-actions[bot]"
          git -C developer-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C developer-repository add -- fr javadoc index.html .nojekyll
          if ! git -C developer-repository diff --cached --quiet; then
            git -C developer-repository commit -m "Publish WorldFinder API and Core"
            git -C developer-repository push origin HEAD:developer-pages
          fi
          mkdir -p source/build/pages-artifact
          rsync -a --exclude='.git' developer-repository/ source/build/pages-artifact/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload developer Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: source/build/pages-artifact

  deploy:
    name: Deploy public Maven and Javadocs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
